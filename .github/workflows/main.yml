name: Auto Approve PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve \
            --body "Automatically approved by GitHub Actions."
